name: Go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxtst-dev libgtk-3-dev libibus-1.0-dev
      - name: Check formatting
        run: |
          files=$(git ls-files '*.go' | grep -v '^vendor/')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run vet
        env:
          CGO_ENABLED: '1'
        run: go vet -mod=vendor ./...
      - name: Run tests
        env:
          CGO_ENABLED: '1'
        run: go test -mod=vendor -race ./...
